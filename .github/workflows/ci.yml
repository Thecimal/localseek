name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The tests use a built-in hashing embedder, so the model runtime (fastembed) is not needed.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pypdf pytest ruff
          pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests eval
      - name: Test
        run: pytest -q
      # Deterministic retrieval-quality gate: fails the build if search quality drops below the recorded floors.
      # It uses the hashing embedder, so it measures the keyword machinery and fusion, not semantic quality; the
      # real model is checked by the manual "Model evaluation" workflow.
      - name: Retrieval quality gate
        run: python eval/run_eval.py --corpus eval/benchmark/corpus --queries eval/benchmark/queries.json --model hash --thresholds eval/benchmark/thresholds-hash.json --by-category
      - name: Update Badges
        uses: gaelgirodon/ci-badges-action@v1
        with:
          gist-id: '54b6d06aa7fa3f825c99d9727994276a'
          token: ${{ secrets.GIST_TOKEN }}
