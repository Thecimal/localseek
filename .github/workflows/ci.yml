name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The tests use a built-in hashing embedder, so the model runtime (fastembed) is not needed.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pypdf pytest ruff
          pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests eval
      - name: Test
        run: pytest -q
      - name: Update Badges
        uses: gaelgirodon/ci-badges-action@v1
        with:
            gist-id: '54b6d06aa7fa3f825c99d9727994276a' # Replace with your full Gist ID
            token: ${{ secrets.GIST_TOKEN }}z
        
