[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "localseek"
version = "0.2.0"
description = "Private, on-device semantic search for your own documents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["search", "semantic-search", "local-first", "privacy", "embeddings", "sqlite"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "numpy>=1.24",
  "fastembed>=0.3",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
mcp = ["mcp>=2,<3"]

[project.scripts]
localseek = "localseek.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
